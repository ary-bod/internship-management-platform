name: CI

# CI jalan DI PR, sebelum merge -- jadi dia gate, bukan pemberitahuan setelah
# rilis. Push ke development juga diverifikasi supaya branch kerja tidak
# diam-diam merah.
on:
  pull_request:
    branches: [development, production]
  push:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tanpa `version`: pnpm dibaca dari field packageManager di package.json,
      # jadi versi di CI dan di laptop tidak bisa melenceng.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # --frozen-lockfile: install gagal kalau lockfile tidak cocok dengan
      # package.json, bukan diam-diam menyelesaikan ulang versi.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
